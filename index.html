<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waveform — Single Wave Prototype</title><style>html,body{margin:0;height:100%;background:#091322;color:#e9f2ff;font:15px system-ui}main{height:100%;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0}#eq{font-size:19px;color:#8fe6ff;font-family:Georgia,serif}#game{flex:1;min-height:300px;width:100%;display:block;touch-action:none;cursor:crosshair}footer{padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#111f34}button{background:#24466a;color:white;border:1px solid #5c85a5;border-radius:7px;padding:8px 14px;cursor:pointer}#hint{color:#bac9db}b{color:#ffe39b}</style></head><body><main><header><h1>Waveform <small style="font-weight:normal;color:#9bb1c8">/ single-wave prototype</small></h1><div id="eq">y = 1.5 sin(1.00x)</div><div id="score">Collected: 0 · Hits: 0</div></header><canvas id="game"></canvas><footer><button id="toggle">Pause</button><button id="reset">Restart</button><span id="hint">Move mouse <b>up/down</b> for amplitude · <b>left/right</b> for wavelength. Collect gold orbs; avoid red hazards.</span></footer></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),eq=document.querySelector('#eq'),score=document.querySelector('#score');let W=0,H=0,dpr=1,amp=1.5,lambda=230,phase=0,elapsed=0,paused=false,points=0,hits=0,objects=[],last=performance.now(),invuln=0;const speed=110;let mouseX=.5,mouseY=.5;function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();function heightScale(){return Math.min(70,H*.19)}function wave(x){return H/2-amp*heightScale()*Math.sin((2*Math.PI/lambda)*(x-100)+phase)}function makeObject(x){const kind=Math.random()<.7?'orb':'hazard';return {x,kind,y:H/2+(Math.random()*2-1)*Math.min(H*.32,155),r:kind==='orb'?11:15,used:false}}function init(){points=0;hits=0;elapsed=0;phase=0;invuln=0;objects=[];for(let i=0;i<12;i++)objects.push(makeObject(W+120+i*140));score.textContent='Collected: 0 · Hits: 0'}init();function pointer(e){const r=canvas.getBoundingClientRect();mouseX=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));mouseY=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));amp=.15+(1-mouseY)*2.9;lambda=100+mouseX*390;eq.textContent=`y = ${amp.toFixed(2)} sin(${(2*Math.PI/lambda*100).toFixed(2)}x)`;eq.title='Here x is measured in units of 100 screen pixels; B = 2π / wavelength.'}canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',pointer);document.querySelector('#toggle').onclick=()=>{paused=!paused;document.querySelector('#toggle').textContent=paused?'Resume':'Pause'};document.querySelector('#reset').onclick=()=>init();function draw(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){elapsed+=dt;phase+=2*Math.PI*speed*dt/lambda;invuln=Math.max(0,invuln-dt);for(const o of objects){o.x-=speed*dt;if(!o.used&&Math.abs(o.x-100)<o.r+7&&Math.abs(o.y-wave(100))<o.r+7){o.used=true;if(o.kind==='orb')points++;else if(invuln===0){hits++;invuln=.8}score.textContent=`Collected: ${points} · Hits: ${hits}`}}objects=objects.filter(o=>o.x>-40);while(objects.length<12){const max=Math.max(W,...objects.map(o=>o.x));objects.push(makeObject(max+135+Math.random()*85))}}ctx.clearRect(0,0,W,H);ctx.fillStyle='#091322';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#21354e';ctx.lineWidth=1;for(let y=H/2%50;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.setLineDash([6,7]);ctx.strokeStyle='#64758c';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();for(let x=0;x<=W;x+=3){let y=wave(x);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='#58d4ff';ctx.lineWidth=3.5;ctx.shadowColor='#36bafa';ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;for(const o of objects){if(o.used)continue;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fillStyle=o.kind==='orb'?'#f7ca69':'#f07883';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=13;ctx.fill();ctx.shadowBlur=0;if(o.kind==='hazard'){ctx.strokeStyle='#5d1627';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x-5,o.y-5);ctx.lineTo(o.x+5,o.y+5);ctx.moveTo(o.x+5,o.y-5);ctx.lineTo(o.x-5,o.y+5);ctx.stroke()}}ctx.beginPath();ctx.arc(100,wave(100),9,0,Math.PI*2);ctx.fillStyle=invuln>0?'#ff9b9b':'#ffffff';ctx.shadowColor='#6cdeff';ctx.shadowBlur=17;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#a9bfd5';ctx.font='12px system-ui';ctx.fillText('PLAYER',78,Math.max(16,wave(100)-20));requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
